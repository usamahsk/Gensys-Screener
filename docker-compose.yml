name: kfc-voice

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kfc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kfc}
      POSTGRES_DB: ${POSTGRES_DB:-kfc}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kfc}"]
      interval: 5s
      timeout: 3s
      retries: 10
    env_file:
      - .env

  api:
    build: ./backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KFC_DATABASE_URL: ${KFC_DATABASE_URL:-postgresql+asyncpg://kfc:kfc@db:5432/kfc}
      KFC_CORS_ORIGINS: ${KFC_CORS_ORIGINS:-*}
      KFC_GEMINI_API_KEY: ${KFC_GEMINI_API_KEY:-}
      KFC_GEMINI_MODEL: ${KFC_GEMINI_MODEL:-gemini-3.5-flash}
      KFC_SEED_ENABLED: ${KFC_SEED_ENABLED:-true}
    ports:
      - "${API_PORT:-8100}:8100"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env

  dashboard:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8100}
    ports:
      - "${DASHBOARD_PORT:-3100}:3000"
    depends_on:
      - api
    env_file:
      - .env

volumes:
  pgdata:
