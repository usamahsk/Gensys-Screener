# Host nginx vhost for dsquare.larynxai.in — KFC Voice app (no Caddy).
#
# Install on the VM:
#   sudo cp nginx/dsquare.larynxai.in.conf /etc/nginx/sites-available/dsquare.larynxai.in
#   sudo ln -sf /etc/nginx/sites-available/dsquare.larynxai.in /etc/nginx/sites-enabled/dsquare.larynxai.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS via certbot (host nginx plugin):
#   sudo certbot --nginx -d dsquare.larynxai.in
# Certbot will insert the ssl_certificate lines; the HTTPS block below already
# handles the proxying once certs exist. If you run certbot first with only the
# port-80 block present, re-copy this file afterwards so the 443 block is active.
#
# Assumes prod compose is running with loopback binds:
#   dashboard -> 127.0.0.1:3100, api -> 127.0.0.1:8100

upstream kfc_dashboard {
    server 127.0.0.1:3100 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream kfc_api {
    server 127.0.0.1:8100 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# --- HTTP: ACME challenge + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name dsquare.larynxai.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: single origin, /api/* -> FastAPI, rest -> Next.js ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dsquare.larynxai.in;

    # Managed by certbot --nginx (keep these two lines; certbot fills them in):
    # ssl_certificate /etc/letsencrypt/live/dsquare.larynxai.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dsquare.larynxai.in/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # --- FastAPI: REST + swagger ---
    location /api/ {
        proxy_pass http://kfc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /docs { return 301 /docs/; }
    location /docs {
        proxy_pass http://kfc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://kfc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://kfc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js dashboard (everything else) ---
    location / {
        proxy_pass http://kfc_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
