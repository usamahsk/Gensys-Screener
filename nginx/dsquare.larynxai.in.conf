# Host nginx vhost for dsquare.larynxai.in — Pizza Bay app (no Caddy).
#
# FIRST INSTALL (no certs yet) — nginx will NOT start with the 443 block but no
# cert files on disk. So first deploy this file with the TLS block at the
# bottom stripped out (delete from its opening marker line through its closing
# marker line — exact command is in the runbook message where this file was
# delivered), then reload nginx and issue certs:
#   sudo mkdir -p /var/www/html
#   sudo certbot certonly --webroot -w /var/www/html -d dsquare.larynxai.in
#
# THEN enable HTTPS — re-copy the full file (with the HTTPS block + live cert paths):
#   sudo cp nginx/dsquare.larynxai.in.conf /etc/nginx/sites-available/dsquare.larynxai.in
#   sudo nginx -t && sudo systemctl reload nginx
#
# Renewal is automatic via certbot's systemd timer. Port 80 stays open for ACME.
#
# Assumes prod compose is running with loopback binds:
#   dashboard -> 127.0.0.1:3100, api -> 127.0.0.1:8100

upstream kfc_dashboard {
    server 127.0.0.1:3100 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream kfc_api {
    server 127.0.0.1:8100 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# --- HTTP: ACME challenge + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name dsquare.larynxai.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS-BEGIN — managed block: requires live certs (see header for first-install steps)
# --- HTTPS: single origin, /api/* -> FastAPI, rest -> Next.js ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dsquare.larynxai.in;

    ssl_certificate /etc/letsencrypt/live/dsquare.larynxai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsquare.larynxai.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # --- FastAPI: REST + swagger ---
    location /api/ {
        proxy_pass http://kfc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /docs { return 301 /docs/; }
    location /docs {
        proxy_pass http://kfc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://kfc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        proxy_pass http://kfc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js dashboard (everything else) ---
    location / {
        proxy_pass http://kfc_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
# HTTPS-END
