name: kfc-voice

# Production overlay for dsquare.larynxai.in (host nginx, no Caddy).
# Pulls images from GHCR (built by .github/workflows/deploy.yml).
# Configure via .env.prod (copy from .env.prod.example); never commit secrets.
# Usage on Azure/VM:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  db:
    image: pgvector/pgvector:pg16
    expose:
      - "5432"
    ports: !override []
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kfc}
      POSTGRES_PASSWORD: ${KFC_DB_PASSWORD:-kfc}
      POSTGRES_DB: ${POSTGRES_DB:-kfc}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    env_file:
      - path: .env.prod
        required: false

  api:
    image: ghcr.io/${GHCR_OWNER:-usamahsk}/kfc-api:${API_TAG:-latest}
    restart: unless-stopped
    ports: !override ["127.0.0.1:8100:8100"]
    environment:
      KFC_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kfc}:${KFC_DB_PASSWORD:-kfc}@db:5432/${POSTGRES_DB:-kfc}
      KFC_CORS_ORIGINS: ${KFC_CORS_ORIGINS:-https://dsquare.larynxai.in,http://127.0.0.1:3100,http://localhost:3100}
      KFC_GEMINI_API_KEY: ${KFC_GEMINI_API_KEY:-}
      KFC_GEMINI_MODEL: ${KFC_GEMINI_MODEL:-gemini-3.5-flash}
      KFC_SEED_ENABLED: "false"
    env_file:
      - path: .env.prod
        required: false

  dashboard:
    image: ghcr.io/${GHCR_OWNER:-usamahsk}/kfc-dashboard:${DASHBOARD_TAG:-latest}
    restart: unless-stopped
    ports: !override ["127.0.0.1:3100:3000"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dsquare.larynxai.in}
    depends_on:
      - api
    env_file:
      - path: .env.prod
        required: false

volumes:
  pgdata:
